openapi: 3.1.0
info:
  title: Trading Wens API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/google/start:
    get:
      summary: Start Google OpenID Connect authorization with PKCE
      responses:
        "302":
          description: Redirect to Google's authorization endpoint
  /auth/google/callback:
    get:
      summary: Complete Google authorization and create an HTTP-only application session
      responses:
        "302":
          description: Redirect to the authenticated dashboard or back to sign-in with an error
  /api/v1/auth/session:
    get:
      summary: Get the current Google-authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Missing, expired, or invalid application session
  /api/v1/auth/logout:
    post:
      summary: Clear the current application session
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session cleared
  /api/v1/news:
    get:
      summary: Get recent large-cap company news
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: Optional valid stock ticker for a focused company query
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent normalized Alpaca and GDELT articles with calibrated model sentiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeedResponse"
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "502":
          description: Authentication or news provider unavailable
  /api/v1/social:
    get:
      summary: Get recent X posts for one stock
      parameters:
        - in: query
          name: symbol
          required: true
          schema:
            type: string
          description: Stock ticker used to build the recent-search query
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent normalized X posts in provider order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialFeedResponse"
        "400":
          description: Missing symbol
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "404":
          description: Invalid symbol format
        "502":
          description: X recent-search API unavailable
        "503":
          description: X source is not configured
  /api/v1/market/stocks/{symbol}/history:
    get:
      summary: Get recent Alpaca bars for one valid stock ticker
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            enum: [1D, 5D, 1M]
            default: 1D
      responses:
        "200":
          description: Provider-normalized historical bars in ascending timestamp order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistoryResponse"
        "400":
          description: Unsupported history range
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "404":
          description: Symbol format is invalid
        "502":
          description: Authentication or market-data provider unavailable
  /api/v1/market/snapshots:
    get:
      summary: Get the current large-cap market watchlist
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest normalized Alpaca snapshots in maintained watchlist order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshotResponse"
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "502":
          description: Authentication or market-data provider unavailable
  /api/v1/trading/portfolio:
    get:
      summary: Get the configured Alpaca paper account and open positions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current paper-account portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "502":
          description: Alpaca paper-trading service unavailable
  /api/v1/trading/assets:
    get:
      summary: Search active tradable US equities
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Up to 100 matching assets from the Alpaca catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAssetsResponse"
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "502":
          description: Alpaca paper-trading service unavailable
  /api/v1/trading/orders:
    post:
      summary: Submit a market or limit order to the Alpaca paper account
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Paper order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Missing, expired, or invalid Google-backed application session
        "422":
          description: Invalid order input
        "502":
          description: Alpaca paper-trading service unavailable
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: trading_wens_session
  schemas:
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/GoogleUser"
    GoogleUser:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url: { type: string, format: uri }
    Portfolio:
      type: object
      required: [account, positions, as_of, source, mode]
      properties:
        account:
          $ref: "#/components/schemas/TradingAccount"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: alpaca
        mode:
          type: string
          const: paper
    TradingAccount:
      type: object
      required:
        [
          id,
          status,
          currency,
          cash,
          buying_power,
          portfolio_value,
          equity,
          last_equity,
          long_market_value,
          trading_blocked,
          pattern_day_trader,
        ]
      properties:
        id: { type: string }
        status: { type: string }
        currency: { type: string }
        cash: { type: number }
        buying_power: { type: number }
        portfolio_value: { type: number }
        equity: { type: number }
        last_equity: { type: number }
        long_market_value: { type: number }
        trading_blocked: { type: boolean }
        pattern_day_trader: { type: boolean }
    Position:
      type: object
      required:
        [
          symbol,
          asset_id,
          side,
          quantity,
          average_entry_price,
          current_price,
          market_value,
          cost_basis,
          unrealized_pl,
          unrealized_pl_percent,
          change_today,
        ]
      properties:
        symbol: { type: string }
        asset_id: { type: string }
        side: { type: string }
        quantity: { type: number }
        average_entry_price: { type: number }
        current_price: { type: number }
        market_value: { type: number }
        cost_basis: { type: number }
        unrealized_pl: { type: number }
        unrealized_pl_percent: { type: number }
        change_today: { type: number }
    TradingAssetsResponse:
      type: object
      required: [data, count, source, mode]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TradingAsset"
        count: { type: integer, minimum: 0 }
        source: { type: string, const: alpaca }
        mode: { type: string, const: paper }
    TradingAsset:
      type: object
      required:
        [
          id,
          symbol,
          name,
          exchange,
          asset_class,
          status,
          tradable,
          fractionable,
        ]
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        asset_class: { type: string }
        status: { type: string }
        tradable: { type: boolean }
        fractionable: { type: boolean }
    OrderRequest:
      type: object
      required: [symbol, quantity, side, type, time_in_force]
      properties:
        symbol: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        side: { type: string, enum: [buy, sell] }
        type: { type: string, enum: [market, limit] }
        limit_price: { type: number, exclusiveMinimum: 0 }
        time_in_force: { type: string, const: day }
    Order:
      type: object
      required:
        [
          id,
          client_order_id,
          symbol,
          quantity,
          filled_quantity,
          side,
          type,
          time_in_force,
          status,
          submitted_at,
          mode,
        ]
      properties:
        id: { type: string }
        client_order_id: { type: string }
        symbol: { type: string }
        quantity: { type: number }
        filled_quantity: { type: number }
        side: { type: string }
        type: { type: string }
        time_in_force: { type: string }
        status: { type: string }
        limit_price: { type: number }
        submitted_at: { type: string, format: date-time }
        mode: { type: string, const: paper }
    NewsFeedResponse:
      type: object
      required: [data, as_of, source, providers, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: aggregated
        providers:
          type: array
          items:
            type: string
        count:
          type: integer
          minimum: 0
    NewsArticle:
      type: object
      required:
        - id
        - title
        - url
        - domain
        - provider
        - published_at
        - language
        - source_country
        - matched_symbols
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        url:
          type: string
          format: uri
        domain:
          type: string
        provider:
          type: string
        published_at:
          type: string
          format: date-time
        language:
          type: string
        source_country:
          type: string
        image_url:
          type: string
          format: uri
        matched_symbols:
          type: array
          items:
            type: string
        sentiment:
          $ref: "#/components/schemas/NewsSentiment"
    NewsSentiment:
      type: object
      required:
        [
          label,
          score,
          confidence,
          uncertainty,
          probabilities,
          model,
          model_version,
        ]
      properties:
        label:
          type: string
          enum: [NEGATIVE, NEUTRAL, POSITIVE]
        score:
          type: number
          minimum: -1
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        uncertainty:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          required: [NEGATIVE, NEUTRAL, POSITIVE]
          properties:
            NEGATIVE: { type: number, minimum: 0, maximum: 1 }
            NEUTRAL: { type: number, minimum: 0, maximum: 1 }
            POSITIVE: { type: number, minimum: 0, maximum: 1 }
        model:
          type: string
        model_version:
          type: string
    SocialFeedResponse:
      type: object
      required: [data, as_of, source, symbol, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SocialPost"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: x
        symbol:
          type: string
        count:
          type: integer
          minimum: 0
    SocialPost:
      type: object
      required:
        [
          id,
          text,
          url,
          author_name,
          username,
          created_at,
          language,
          matched_symbol,
          metrics,
        ]
      properties:
        id: { type: string }
        text: { type: string }
        url: { type: string, format: uri }
        author_name: { type: string }
        username: { type: string }
        avatar_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        language: { type: string }
        matched_symbol: { type: string }
        metrics:
          $ref: "#/components/schemas/SocialMetrics"
    SocialMetrics:
      type: object
      required: [likes, replies, reposts, quotes]
      properties:
        likes: { type: integer, minimum: 0 }
        replies: { type: integer, minimum: 0 }
        reposts: { type: integer, minimum: 0 }
        quotes: { type: integer, minimum: 0 }
    MarketSnapshotResponse:
      type: object
      required: [data, as_of, feed, source, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketSnapshot"
        as_of:
          type: string
          format: date-time
        feed:
          type: string
          enum: [iex, sip, delayed_sip, boats, overnight, otc]
        source:
          type: string
          const: alpaca
        count:
          type: integer
          minimum: 0
    StockHistoryResponse:
      type: object
      required:
        [symbol, name, data, as_of, range, timeframe, feed, source, count]
      properties:
        symbol:
          type: string
        name:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketBar"
        as_of:
          type: string
          format: date-time
        range:
          type: string
          enum: [1D, 5D, 1M]
        timeframe:
          type: string
          enum: [5Min, 15Min, 1Hour]
        feed:
          type: string
        source:
          type: string
          const: alpaca
        count:
          type: integer
          minimum: 0
    MarketBar:
      type: object
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          minimum: 0
    MarketSnapshot:
      type: object
      required:
        - symbol
        - name
        - price
        - change
        - change_percent
        - open
        - high
        - low
        - previous_close
        - volume
        - timestamp
        - available
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        change_percent:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        previous_close:
          type: number
        volume:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        available:
          type: boolean
