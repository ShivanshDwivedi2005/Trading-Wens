openapi: 3.1.0
info:
  title: Trading Wens API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/news:
    get:
      summary: Get recent large-cap company news
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent normalized GDELT articles in descending publication order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeedResponse"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Authentication or news provider unavailable
  /api/v1/market/snapshots:
    get:
      summary: Get the current large-cap market watchlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest normalized Alpaca snapshots in maintained watchlist order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshotResponse"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Authentication or market-data provider unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NewsFeedResponse:
      type: object
      required: [data, as_of, source, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: gdelt
        count:
          type: integer
          minimum: 0
    NewsArticle:
      type: object
      required:
        - id
        - title
        - url
        - domain
        - published_at
        - language
        - source_country
        - matched_symbols
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        domain:
          type: string
        published_at:
          type: string
          format: date-time
        language:
          type: string
        source_country:
          type: string
        image_url:
          type: string
          format: uri
        matched_symbols:
          type: array
          items:
            type: string
    MarketSnapshotResponse:
      type: object
      required: [data, as_of, feed, source, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketSnapshot"
        as_of:
          type: string
          format: date-time
        feed:
          type: string
          enum: [iex, sip, delayed_sip, boats, overnight, otc]
        source:
          type: string
          const: alpaca
        count:
          type: integer
          minimum: 0
    MarketSnapshot:
      type: object
      required:
        - symbol
        - name
        - price
        - change
        - change_percent
        - open
        - high
        - low
        - previous_close
        - volume
        - timestamp
        - available
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        change_percent:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        previous_close:
          type: number
        volume:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        available:
          type: boolean
