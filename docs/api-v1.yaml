openapi: 3.1.0
info:
  title: Trading Wens API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/news:
    get:
      summary: Get recent large-cap company news
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          description: Optional valid stock ticker for a focused company query
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent normalized GDELT articles in descending publication order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFeedResponse"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Authentication or news provider unavailable
  /api/v1/market/stocks/{symbol}/history:
    get:
      summary: Get recent Alpaca bars for one valid stock ticker
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            enum: [1D, 5D, 1M]
            default: 1D
      responses:
        "200":
          description: Provider-normalized historical bars in ascending timestamp order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistoryResponse"
        "400":
          description: Unsupported history range
        "401":
          description: Missing, expired, or invalid Supabase access token
        "404":
          description: Symbol format is invalid
        "502":
          description: Authentication or market-data provider unavailable
  /api/v1/market/snapshots:
    get:
      summary: Get the current large-cap market watchlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest normalized Alpaca snapshots in maintained watchlist order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshotResponse"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Authentication or market-data provider unavailable
  /api/v1/trading/portfolio:
    get:
      summary: Get the configured Alpaca paper account and open positions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current paper-account portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Alpaca paper-trading service unavailable
  /api/v1/trading/assets:
    get:
      summary: Search active tradable US equities
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Up to 100 matching assets from the Alpaca catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingAssetsResponse"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "502":
          description: Alpaca paper-trading service unavailable
  /api/v1/trading/orders:
    post:
      summary: Submit a market or limit order to the Alpaca paper account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Paper order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Missing, expired, or invalid Supabase access token
        "422":
          description: Invalid order input
        "502":
          description: Alpaca paper-trading service unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Portfolio:
      type: object
      required: [account, positions, as_of, source, mode]
      properties:
        account:
          $ref: "#/components/schemas/TradingAccount"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: alpaca
        mode:
          type: string
          const: paper
    TradingAccount:
      type: object
      required: [id, status, currency, cash, buying_power, portfolio_value, equity, last_equity, long_market_value, trading_blocked, pattern_day_trader]
      properties:
        id: { type: string }
        status: { type: string }
        currency: { type: string }
        cash: { type: number }
        buying_power: { type: number }
        portfolio_value: { type: number }
        equity: { type: number }
        last_equity: { type: number }
        long_market_value: { type: number }
        trading_blocked: { type: boolean }
        pattern_day_trader: { type: boolean }
    Position:
      type: object
      required: [symbol, asset_id, side, quantity, average_entry_price, current_price, market_value, cost_basis, unrealized_pl, unrealized_pl_percent, change_today]
      properties:
        symbol: { type: string }
        asset_id: { type: string }
        side: { type: string }
        quantity: { type: number }
        average_entry_price: { type: number }
        current_price: { type: number }
        market_value: { type: number }
        cost_basis: { type: number }
        unrealized_pl: { type: number }
        unrealized_pl_percent: { type: number }
        change_today: { type: number }
    TradingAssetsResponse:
      type: object
      required: [data, count, source, mode]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TradingAsset"
        count: { type: integer, minimum: 0 }
        source: { type: string, const: alpaca }
        mode: { type: string, const: paper }
    TradingAsset:
      type: object
      required: [id, symbol, name, exchange, asset_class, status, tradable, fractionable]
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        asset_class: { type: string }
        status: { type: string }
        tradable: { type: boolean }
        fractionable: { type: boolean }
    OrderRequest:
      type: object
      required: [symbol, quantity, side, type, time_in_force]
      properties:
        symbol: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        side: { type: string, enum: [buy, sell] }
        type: { type: string, enum: [market, limit] }
        limit_price: { type: number, exclusiveMinimum: 0 }
        time_in_force: { type: string, const: day }
    Order:
      type: object
      required: [id, client_order_id, symbol, quantity, filled_quantity, side, type, time_in_force, status, submitted_at, mode]
      properties:
        id: { type: string }
        client_order_id: { type: string }
        symbol: { type: string }
        quantity: { type: number }
        filled_quantity: { type: number }
        side: { type: string }
        type: { type: string }
        time_in_force: { type: string }
        status: { type: string }
        limit_price: { type: number }
        submitted_at: { type: string, format: date-time }
        mode: { type: string, const: paper }
    NewsFeedResponse:
      type: object
      required: [data, as_of, source, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        as_of:
          type: string
          format: date-time
        source:
          type: string
          const: gdelt
        count:
          type: integer
          minimum: 0
    NewsArticle:
      type: object
      required:
        - id
        - title
        - url
        - domain
        - published_at
        - language
        - source_country
        - matched_symbols
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        domain:
          type: string
        published_at:
          type: string
          format: date-time
        language:
          type: string
        source_country:
          type: string
        image_url:
          type: string
          format: uri
        matched_symbols:
          type: array
          items:
            type: string
    MarketSnapshotResponse:
      type: object
      required: [data, as_of, feed, source, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketSnapshot"
        as_of:
          type: string
          format: date-time
        feed:
          type: string
          enum: [iex, sip, delayed_sip, boats, overnight, otc]
        source:
          type: string
          const: alpaca
        count:
          type: integer
          minimum: 0
    StockHistoryResponse:
      type: object
      required: [symbol, name, data, as_of, range, timeframe, feed, source, count]
      properties:
        symbol:
          type: string
        name:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketBar"
        as_of:
          type: string
          format: date-time
        range:
          type: string
          enum: [1D, 5D, 1M]
        timeframe:
          type: string
          enum: [5Min, 15Min, 1Hour]
        feed:
          type: string
        source:
          type: string
          const: alpaca
        count:
          type: integer
          minimum: 0
    MarketBar:
      type: object
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          minimum: 0
    MarketSnapshot:
      type: object
      required:
        - symbol
        - name
        - price
        - change
        - change_percent
        - open
        - high
        - low
        - previous_close
        - volume
        - timestamp
        - available
      properties:
        symbol:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        change_percent:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        previous_close:
          type: number
        volume:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time
        available:
          type: boolean
